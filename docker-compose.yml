# AI智序 - 核心服务编排（生产加固）
# 用法：
#   首次/更新：docker compose up -d --build
#   全栈（含 Dify CE）：docker compose -f docker-compose.yml -f compose.dify.yml --profile dify up -d
# 所有端口仅绑定 127.0.0.1；对外入口只有 nginx 的 80/443。
# 配置从根目录 .env 读取（勿提交；模板见 .env.example）。

name: projecthub-ai

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - projecthub-net
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - projecthub-net
    mem_limit: 256m

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - projecthub-net
    mem_limit: 1g

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ""
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - projecthub-net
    mem_limit: 128m

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 证书放这里（certbot 生成后），HTTPS 块启用后生效
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - projecthub-net
    mem_limit: 64m

volumes:
  postgres_data:
  redis_data:

networks:
  projecthub-net:
    name: projecthub-net
